services:
  sungrow-gateway:
    build: .
    container_name: sungrow-modbus-gateway
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${FLASK_PORT:-5000}:${FLASK_PORT:-5000}"
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.getenv('FLASK_PORT', '5000') + '/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
